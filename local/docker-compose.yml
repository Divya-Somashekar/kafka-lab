# One Kafka broker in KRaft mode (no ZooKeeper), plus a web UI. Start with:
#   docker compose -f local/docker-compose.yml up -d
#
# The tests do NOT use this — they start their own throwaway broker via Testcontainers.
#
# `name:` is set explicitly: without it Compose names the project after the directory, which is
# `local` in every one of these repos, and they would reuse each other's volumes.
name: kafka-lab

services:
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      # A KRaft node is a broker, a controller, or both. Both, here — one container.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two client listeners, because a client is told to reconnect to the *advertised* address.
      # Containers resolve `kafka`; your laptop does not, so it gets `localhost:9092` instead.
      # Getting this wrong is the classic symptom: metadata fetch works, then every produce times out.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Internal topics default to 3 replicas, which never becomes in-sync on a single broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Default is 3s of deliberate delay before the first rebalance, to batch joining consumers.
      # Fine in production, tedious while restarting the app every minute.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Browse topics, read messages, watch consumer-group lag: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
